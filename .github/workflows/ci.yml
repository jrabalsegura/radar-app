name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Type-check
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  worker:
    name: Worker
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: apps/worker/requirements-dev.lock

      - name: Install development tools
        run: |
          python -m pip install --requirement apps/worker/requirements-dev.lock
          python -m pip install --force-reinstall --no-deps --no-build-isolation apps/worker

      - name: Lint
        run: ruff check .

      - name: Check formatting
        run: ruff format --check .

      - name: Type-check
        run: mypy apps/worker/src apps/worker/tests

      - name: Test
        run: pytest

  containers:
    name: Container images
    runs-on: ubuntu-latest
    needs: [frontend, worker]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build worker image
        run: >-
          docker build
          --file deploy/containers/worker.Containerfile
          --tag aemet-radar-worker:ci
          .

      - name: Build web image
        run: >-
          docker build
          --file deploy/containers/web.Containerfile
          --tag aemet-radar-web:ci
          .

      - name: Verify non-root image users
        run: |
          test "$(docker image inspect aemet-radar-worker:ci --format '{{.Config.User}}')" = "10001:10001"
          test "$(docker image inspect aemet-radar-web:ci --format '{{.Config.User}}')" = "10001:10001"
