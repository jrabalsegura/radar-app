name: CI

on:
  push:
    branches: ["main", "claude/**", "codex/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Type-check
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Install Chrome for browser tests
        run: npx playwright install --with-deps chrome

      - name: Browser tests (desktop and mobile)
        run: npx playwright test --workers=2

      - name: Browser diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-results
          path: |
            apps/web/test-results
            apps/web/playwright-report
          if-no-files-found: ignore
          retention-days: 7

  worker:
    name: Worker
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: apps/worker/requirements-dev.lock

      - name: Install development tools
        run: |
          python -m pip install --requirement apps/worker/requirements-dev.lock
          python -m pip install --force-reinstall --no-deps --no-build-isolation apps/worker

      - name: Lint
        run: ruff check .

      - name: Check formatting
        run: ruff format --check .

      - name: Type-check
        run: mypy apps/worker/src apps/worker/tests

      - name: Test
        run: pytest

  containers:
    name: Container images
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [frontend, worker]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build worker image
        run: >-
          docker build
          --file deploy/containers/worker.Containerfile
          --tag aemet-radar-worker:ci
          .

      - name: Build web image
        run: >-
          docker build
          --file deploy/containers/web.Containerfile
          --tag aemet-radar-web:ci
          .

      - name: Verify non-root image users
        run: |
          test "$(docker image inspect aemet-radar-worker:ci --format '{{.Config.User}}')" = "10001:10001"
          test "$(docker image inspect aemet-radar-web:ci --format '{{.Config.User}}')" = "10001:10001"

      - name: Serve fixtures with production nginx and verify public image references
        run: |
          docker run --detach --name radar-web-ci --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,size=64m \
            --publish 127.0.0.1:8080:8080 \
            --volume "$GITHUB_WORKSPACE/apps/web/public:/data:ro" \
            aemet-radar-web:ci
          curl --fail --silent --retry 10 --retry-connrefused --retry-delay 1 \
            http://127.0.0.1:8080/healthz
          ./deploy/scripts/smoke-test.sh http://127.0.0.1:8080

      - name: Container logs
        if: failure()
        run: docker logs radar-web-ci

      - name: Validate Quadlets with Podman 4.9
        run: >-
          docker run --rm
          --entrypoint /usr/lib/systemd/system-generators/podman-system-generator
          --env QUADLET_UNIT_DIRS=/units
          --volume "$GITHUB_WORKSPACE/deploy/quadlet:/units:ro"
          quay.io/podman/stable:v4.9.3
          --dryrun
