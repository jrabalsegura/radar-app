[build-system]
requires = ["setuptools==83.0.0", "wheel==0.47.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aemet-radar-worker"
version = "0.5.0"
description = "Worker de la aplicación personal Radar AEMET"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28,<1",
    "Pillow>=11,<13",
    "pyproj>=3.7,<4",
    "python-dotenv>=1.1,<2",
]

[project.scripts]
aemet-radar = "aemet_radar.cli:main"

[project.optional-dependencies]
dev = [
    "mypy>=1.14,<2",
    "pytest>=8.3,<10",
    "ruff>=0.9,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
aemet_radar = ["py.typed"]
