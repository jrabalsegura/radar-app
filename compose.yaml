name: aemet-radar

services:
  worker:
    image: aemet-radar-worker:local
    build:
      context: .
      dockerfile: deploy/containers/worker.Containerfile
    user: "${RADAR_UID:-10001}:${RADAR_GID:-10001}"
    env_file:
      - .env
    volumes:
      - ./data:/data
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    stop_signal: SIGINT
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
  web:
    image: aemet-radar-web:local
    build:
      context: .
      dockerfile: deploy/containers/web.Containerfile
      args:
        VITE_MAP_STYLE_URL: "${VITE_MAP_STYLE_URL:-https://tiles.openfreemap.org/styles/liberty}"
    user: "${RADAR_UID:-10001}:${RADAR_GID:-10001}"
    ports:
      - "127.0.0.1:${RADAR_HTTP_PORT:-8080}:8080"
    volumes:
      - ./data:/data:ro
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    stop_signal: SIGQUIT
    stop_grace_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
